openapi: 3.1.0
info:
  title: Piko API
  version: 0.1.0
  description: |
    Piko makes PayPal the default way AI agents pay, and get paid.
    Amounts are integer micro-USD encoded as strings ("2000" = $0.002).
    Keep this spec at 10 operations or fewer (APIMatic free plan).
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: Local
  - url: https://{host}
    description: Hosted (Render)
    variables:
      host:
        default: piko.onrender.com
security:
  - agentKey: []
tags:
  - name: Gateway
  - name: Payments
  - name: Directory
  - name: Facilitator

paths:
  /g/{seller}/{path}:
    get:
      tags: [Gateway]
      operationId: gatewayCall
      summary: Call a seller endpoint through the hosted gateway
      description: |
        Without PAYMENT-SIGNATURE (and without X-Piko-Autopay) returns 402 with a challenge.
        With a valid receipt, proxies to the seller and returns the upstream response.
        A free Call (agent key, within the endpoint's free quota) and any call to an
        endpoint priced at 0 are proxied without a challenge. An upstream Location or
        Content-Location under the seller's base URL is rewritten to /g/{seller}/...,
        and one elsewhere on the upstream's origin is dropped.
        Other HTTP methods behave the same way.
      security:
        - {}
        - agentKey: []
      parameters:
        - { name: seller, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string }, description: "Rest of the upstream path" }
        - name: PAYMENT-SIGNATURE
          in: header
          required: false
          schema: { type: string }
          description: |
            Base64-encoded JSON x402 v2 PaymentPayload whose payload is { receipt }.
            POST /api/pay returns it ready-made as paymentSignature.
        - name: X-Piko-Autopay
          in: header
          required: false
          schema: { type: string, example: "true" }
          description: |
            Only the value true (any case) turns it on: with an agent key, pay and call in one
            request. A key is required; without one, or with a wrong one, the answer is
            401 invalid_key. Any other value is an ordinary request and gets the 402.
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 255 }
          description: |
            Only with X-Piko-Autopay. A retry with the same key (per agent and endpoint) never
            pays twice: 409 idempotent_replay once paid, 409 idempotency_in_progress while the
            first request runs. See docs/API.md section 2.
      responses:
        "200":
          description: Upstream response (any upstream 2xx–4xx is passed through)
          headers:
            PAYMENT-RESPONSE:
              schema: { type: string }
              description: Base64-encoded JSON x402 v2 SettlementResponse (see the Settlement schema)
        "402":
          description: |
            Payment required: the body is a Challenge and PAYMENT-REQUIRED is set.
            Or a PAYMENT-SIGNATURE that failed verification: the body is an Error with
            code invalid_receipt and there is no PAYMENT-REQUIRED header.
            With X-Piko-Autopay, an Error with code insufficient_funds or budget_exceeded
            (no PAYMENT-REQUIRED header); nothing was forwarded or charged.
          headers:
            PAYMENT-REQUIRED:
              schema: { type: string }
              description: Base64-encoded JSON x402 v2 PaymentRequired (the same object as the body). Only with a Challenge body.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Challenge" }
                  - { $ref: "#/components/schemas/Error" }
        "400":
          description: With X-Piko-Autopay, an Idempotency-Key that is empty or too long (code invalid_request)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: With X-Piko-Autopay, a policy blocked the payment (code policy_denied)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            With X-Piko-Autopay and an Idempotency-Key already used: idempotent_replay (already
            paid; details callId and upstreamStatus) or idempotency_in_progress. Nothing was charged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "408":
          description: The request body did not arrive in time (code request_timeout); nothing was forwarded or charged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429":
          description: With X-Piko-Autopay, the circuit breaker froze the agent (code breaker_tripped); nothing was forwarded or charged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Upstream failed; nothing was charged
          headers:
            PAYMENT-RESPONSE:
              schema: { type: string }
              description: Base64 SettlementResponse with success false and errorReason upstream_failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/pay:
    post:
      tags: [Payments]
      operationId: pay
      summary: Authorise payment for a challenge and get a receipt
      description: |
        Safe to retry: the same agent paying the same nonce again, while its hold is
        active and unused, gets the same receipt and the amount is held once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce]
              properties:
                nonce: { type: string }
      responses:
        "200":
          description: Receipt issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "202":
          description: Approval pending (code approval_pending)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429":
          description: |
            The circuit breaker froze the agent (code breaker_tripped). Details: reason
            (calls or spend), calls, windowSeconds and spentPerMinute (micro-USD), each
            including this payment. Nothing was charged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/approvals/{id}:
    get:
      tags: [Payments]
      operationId: getApproval
      summary: Poll an approval
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "404": { $ref: "#/components/responses/Error" }

  /api/directory/search:
    get:
      tags: [Directory]
      operationId: searchDirectory
      summary: Semantic search over listings, priced for the caller's org
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 5, minimum: 1, maximum: 20 } }
      responses:
        "200":
          description: Matching listings
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Listing" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503":
          description: The embedding model is busy (`ai_busy`). Try again shortly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/wallet:
    get:
      tags: [Payments]
      operationId: getWallet
      summary: Balance, remaining budgets and frozen state for this key
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "401": { $ref: "#/components/responses/Error" }

  /api/facilitator/supported:
    get:
      tags: [Facilitator]
      operationId: facilitatorSupported
      summary: Schemes and networks Piko settles
      security: [{}]
      responses:
        "200":
          description: Supported kinds
          content:
            application/json:
              schema:
                type: object
                required: [kinds, extensions, signers]
                properties:
                  kinds:
                    type: array
                    items:
                      type: object
                      required: [x402Version, scheme, network]
                      properties:
                        x402Version: { type: integer, example: 2 }
                        scheme: { type: string, example: paypal-ledger }
                        network: { type: string, example: "paypal:sandbox" }
                        extra: { type: object, additionalProperties: true }
                  extensions:
                    type: array
                    items: { type: string }
                    description: Extension identifiers Piko implements (none yet)
                  signers:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
                    description: CAIP-2 pattern to signer addresses; empty because nothing is signed on-chain

  /api/facilitator/verify:
    post:
      tags: [Facilitator]
      operationId: facilitatorVerify
      summary: Check a payment without consuming it (read-only)
      description: Open to anyone holding the PaymentPayload; the receipt is the credential.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacilitatorRequest" }
      responses:
        "400":
          description: |
            Unusable request body. isValid is false and invalidReason is invalid_payload,
            invalid_x402_version or invalid_payment_requirements.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResponse" }
        "200":
          description: Verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResponse" }

  /api/facilitator/settle:
    post:
      tags: [Facilitator]
      operationId: facilitatorSettle
      summary: Consume a receipt and settle the ledger
      description: |
        Call only after the protected handler succeeded (x402 authorization flow).
        If settle is never called, the reservation is released when the receipt expires.
        Open to anyone holding the PaymentPayload; the receipt is the credential.
        Every response, failures included, is an x402 SettlementResponse.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacilitatorRequest" }
      responses:
        "400":
          description: |
            Unusable request body. success is false, transaction is empty and errorReason is
            invalid_payload, invalid_x402_version or invalid_payment_requirements.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
        "200":
          description: Settlement; success is false and errorReason is invalid_receipt for a tampered payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
        "410":
          description: The receipt expired or was already used; success is false and errorReason is challenge_expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }

components:
  securitySchemes:
    agentKey:
      type: http
      scheme: bearer
      description: Agent key, format pk_agent_<secret>

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    MicroUsd:
      type: string
      pattern: "^[0-9]+$"
      description: Integer micro-USD (1 USD = 1000000)

    ResourceInfo:
      type: object
      description: x402 v2 ResourceInfo
      required: [url]
      properties:
        url: { type: string, format: uri }
        description: { type: string }
        mimeType: { type: string }
        serviceName: { type: string, maxLength: 32 }
        tags:
          type: array
          maxItems: 5
          items: { type: string, maxLength: 32 }
        iconUrl: { type: string, format: uri }

    PaymentRequirement:
      type: object
      description: x402 v2 PaymentRequirements for the paypal-ledger scheme
      required: [scheme, network, amount, asset, payTo, maxTimeoutSeconds, extra]
      properties:
        scheme: { type: string, example: paypal-ledger }
        network: { type: string, example: "paypal:sandbox", description: "CAIP-2 style namespace:reference" }
        amount: { $ref: "#/components/schemas/MicroUsd" }
        asset: { type: string, example: USD, description: "ISO 4217 code; amount is in micro-units (extra.decimals: 6), not cents as in the cloudflare:402 precedent" }
        payTo: { type: string, description: Seller slug }
        maxTimeoutSeconds: { type: integer, example: 60 }
        extra:
          type: object
          description: Scheme-specific fields for paypal-ledger
          required: [decimals, nonce, expiresAt, facilitator, payUrl]
          properties:
            decimals: { type: integer, enum: [6] }
            nonce: { type: string }
            expiresAt: { type: string, format: date-time }
            facilitator: { type: string, format: uri }
            payUrl: { type: string, format: uri, description: POST here with the nonce to get a receipt }
          additionalProperties: true

    Challenge:
      type: object
      description: x402 v2 PaymentRequired
      required: [x402Version, resource, accepts]
      properties:
        x402Version: { type: integer, enum: [2] }
        error: { type: string }
        resource: { $ref: "#/components/schemas/ResourceInfo" }
        accepts:
          type: array
          items: { $ref: "#/components/schemas/PaymentRequirement" }
        extensions: { type: object, additionalProperties: true }

    PaymentPayload:
      type: object
      description: x402 v2 PaymentPayload; sent base64-encoded in PAYMENT-SIGNATURE
      required: [x402Version, accepted, payload]
      properties:
        x402Version: { type: integer, enum: [2] }
        resource: { $ref: "#/components/schemas/ResourceInfo" }
        accepted: { $ref: "#/components/schemas/PaymentRequirement" }
        payload:
          type: object
          required: [receipt]
          properties:
            receipt: { type: string, description: Signed single-use JWT from POST /api/pay }
        extensions: { type: object, additionalProperties: true }

    Receipt:
      type: object
      required: [receipt, paymentSignature, amount, expiresAt]
      properties:
        receipt: { type: string, description: Signed single-use JWT }
        paymentSignature: { type: string, description: Base64 PaymentPayload wrapping the receipt; send as the PAYMENT-SIGNATURE header }
        amount: { $ref: "#/components/schemas/MicroUsd" }
        expiresAt: { type: string, format: date-time }

    Approval:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, approved, denied] }
        amount: { $ref: "#/components/schemas/MicroUsd" }
        receipt: { type: string, description: Present once approved }

    Listing:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: [string, "null"] }
        kind: { type: string, enum: [http, mcp, both] }
        rating: { type: [string, "null"], description: "0 to 5, one decimal." }
        seller:
          type: object
          properties:
            slug: { type: string }
            name: { type: string }
        score: { type: number, description: "Cosine similarity to the query, 0 to 1. Results are best first." }
        endpoints:
          type: array
          items:
            type: object
            properties:
              method: { type: string }
              path: { type: string }
              priceMicro: { $ref: "#/components/schemas/MicroUsd", description: "What the caller's org pays: its enterprise rate if it has one, else the list price." }
              price: { type: string, description: "priceMicro for display, e.g. $0.002." }
              gatewayPath: { type: string, description: "Where to send the request: /g/{seller}{path}." }

    Wallet:
      type: object
      properties:
        agentId: { type: string }
        orgId: { type: string }
        billing: { type: string, enum: [prepaid, invoiced] }
        balance: { $ref: "#/components/schemas/MicroUsd" }
        creditRemaining: { $ref: "#/components/schemas/MicroUsd" }
        frozen: { type: boolean }
        budgets:
          type: array
          items:
            type: object
            properties:
              scope: { type: string, enum: [org, team, agent, task] }
              period: { type: string }
              max: { $ref: "#/components/schemas/MicroUsd" }
              remaining: { $ref: "#/components/schemas/MicroUsd" }

    FacilitatorRequest:
      type: object
      description: x402 v2 facilitator /verify and /settle request
      required: [x402Version, paymentPayload, paymentRequirements]
      properties:
        x402Version: { type: integer, enum: [2] }
        paymentPayload: { $ref: "#/components/schemas/PaymentPayload" }
        paymentRequirements: { $ref: "#/components/schemas/PaymentRequirement" }

    VerifyResponse:
      type: object
      description: x402 v2 VerifyResponse
      required: [isValid]
      properties:
        isValid: { type: boolean }
        invalidReason: { type: string, description: "Machine-readable code, e.g. challenge_expired or invalid_payload" }
        invalidMessage: { type: string }
        payer: { type: string, description: Agent id }

    Settlement:
      type: object
      description: x402 v2 SettlementResponse
      required: [success, transaction, network]
      properties:
        success: { type: boolean }
        errorReason: { type: string, description: "Present on failure, e.g. upstream_failed or challenge_expired" }
        errorMessage: { type: string }
        transaction: { type: string, description: Piko Call id; empty string when nothing was settled }
        network: { type: string, example: "paypal:sandbox" }
        payer: { type: string, description: Agent id }
        amount: { $ref: "#/components/schemas/MicroUsd" }
        extensions: { type: object, additionalProperties: true }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_key, agent_frozen, breaker_tripped, policy_denied, approval_pending, budget_exceeded, insufficient_funds, challenge_expired, challenge_buyer_mismatch, upstream_failed, not_found, invalid_request, invalid_amount, invalid_receipt, request_timeout, internal_error]
            message: { type: string }
          additionalProperties: true
