openapi: 3.1.0
info:
  title: Piko API
  version: 0.1.0
  description: |
    Piko makes PayPal the default way AI agents pay, and get paid.
    Amounts are integer micro-USD encoded as strings ("2000" = $0.002).
    Keep this spec at 10 operations or fewer (APIMatic free plan).
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: Local
  - url: https://{host}
    description: Hosted (Render)
    variables:
      host:
        default: piko.onrender.com
security:
  - agentKey: []
tags:
  - name: Gateway
  - name: Payments
  - name: Directory
  - name: Facilitator

paths:
  /g/{seller}/{path}:
    get:
      tags: [Gateway]
      operationId: gatewayCall
      summary: Call a seller endpoint through the hosted gateway
      description: |
        Without PAYMENT-SIGNATURE (and without X-Piko-Autopay) returns 402 with a challenge.
        With a valid receipt, proxies to the seller and returns the upstream response.
        Other HTTP methods behave the same way.
      security:
        - {}
        - agentKey: []
      parameters:
        - { name: seller, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string }, description: "Rest of the upstream path" }
        - name: PAYMENT-SIGNATURE
          in: header
          required: false
          schema: { type: string }
          description: |
            Base64-encoded JSON x402 v2 PaymentPayload whose payload is { receipt }.
            POST /api/pay returns it ready-made as paymentSignature.
        - name: X-Piko-Autopay
          in: header
          required: false
          schema: { type: boolean }
          description: With an agent key, pay and call in one request
      responses:
        "200":
          description: Upstream response (any upstream 2xx–4xx is passed through)
          headers:
            PAYMENT-RESPONSE:
              schema: { type: string }
              description: Base64-encoded JSON x402 v2 SettlementResponse (see the Settlement schema)
        "402":
          description: Payment required
          headers:
            PAYMENT-REQUIRED:
              schema: { type: string }
              description: Base64-encoded JSON x402 v2 PaymentRequired (the same object as the body)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Challenge" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "502":
          description: Upstream failed; the call was refunded
          headers:
            PAYMENT-RESPONSE:
              schema: { type: string }
              description: Base64 SettlementResponse with success false and errorReason upstream_failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/pay:
    post:
      tags: [Payments]
      operationId: pay
      summary: Authorise payment for a challenge and get a receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce]
              properties:
                nonce: { type: string }
      responses:
        "200":
          description: Receipt issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "202":
          description: Approval pending (code approval_pending)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/approvals/{id}:
    get:
      tags: [Payments]
      operationId: getApproval
      summary: Poll an approval
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "404": { $ref: "#/components/responses/Error" }

  /api/directory/search:
    get:
      tags: [Directory]
      operationId: searchDirectory
      summary: Semantic search over listings, priced for the caller's org
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        "200":
          description: Matching listings
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Listing" }

  /api/wallet:
    get:
      tags: [Payments]
      operationId: getWallet
      summary: Balance, remaining budgets and frozen state for this key
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "401": { $ref: "#/components/responses/Error" }

  /api/facilitator/supported:
    get:
      tags: [Facilitator]
      operationId: facilitatorSupported
      summary: Schemes and networks Piko settles
      security: [{}]
      responses:
        "200":
          description: Supported kinds
          content:
            application/json:
              schema:
                type: object
                required: [kinds, extensions, signers]
                properties:
                  kinds:
                    type: array
                    items:
                      type: object
                      required: [x402Version, scheme, network]
                      properties:
                        x402Version: { type: integer, example: 2 }
                        scheme: { type: string, example: paypal-ledger }
                        network: { type: string, example: "paypal:sandbox" }
                        extra: { type: object, additionalProperties: true }
                  extensions:
                    type: array
                    items: { type: string }
                    description: Extension identifiers Piko implements (none yet)
                  signers:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
                    description: CAIP-2 pattern to signer addresses; empty because nothing is signed on-chain

  /api/facilitator/verify:
    post:
      tags: [Facilitator]
      operationId: facilitatorVerify
      summary: Check a payment without consuming it (read-only)
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacilitatorRequest" }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required: [isValid]
                properties:
                  isValid: { type: boolean }
                  invalidReason: { type: string, description: "Machine-readable code, e.g. challenge_expired" }
                  invalidMessage: { type: string }
                  payer: { type: string, description: Agent id }

  /api/facilitator/settle:
    post:
      tags: [Facilitator]
      operationId: facilitatorSettle
      summary: Consume a receipt and settle the ledger
      description: |
        Call only after the protected handler succeeded (x402 authorization flow).
        If settle is never called, the reservation is released when the receipt expires.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacilitatorRequest" }
      responses:
        "200":
          description: Settlement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
        "410": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    agentKey:
      type: http
      scheme: bearer
      description: Agent key, format pk_agent_<secret>

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    MicroUsd:
      type: string
      pattern: "^[0-9]+$"
      description: Integer micro-USD (1 USD = 1000000)

    ResourceInfo:
      type: object
      description: x402 v2 ResourceInfo
      required: [url]
      properties:
        url: { type: string, format: uri }
        description: { type: string }
        mimeType: { type: string }
        serviceName: { type: string, maxLength: 32 }
        tags:
          type: array
          maxItems: 5
          items: { type: string, maxLength: 32 }
        iconUrl: { type: string, format: uri }

    PaymentRequirement:
      type: object
      description: x402 v2 PaymentRequirements for the paypal-ledger scheme
      required: [scheme, network, amount, asset, payTo, maxTimeoutSeconds, extra]
      properties:
        scheme: { type: string, example: paypal-ledger }
        network: { type: string, example: "paypal:sandbox", description: "CAIP-2 style namespace:reference" }
        amount: { $ref: "#/components/schemas/MicroUsd" }
        asset: { type: string, example: USD, description: "ISO 4217 code; amount is in micro-units (extra.decimals)" }
        payTo: { type: string, description: Seller slug }
        maxTimeoutSeconds: { type: integer, example: 60 }
        extra:
          type: object
          description: Scheme-specific fields for paypal-ledger
          required: [decimals, nonce, expiresAt, facilitator, payUrl]
          properties:
            decimals: { type: integer, enum: [6] }
            nonce: { type: string }
            expiresAt: { type: string, format: date-time }
            facilitator: { type: string, format: uri }
            payUrl: { type: string, format: uri, description: POST here with the nonce to get a receipt }
          additionalProperties: true

    Challenge:
      type: object
      description: x402 v2 PaymentRequired
      required: [x402Version, resource, accepts]
      properties:
        x402Version: { type: integer, enum: [2] }
        error: { type: string }
        resource: { $ref: "#/components/schemas/ResourceInfo" }
        accepts:
          type: array
          items: { $ref: "#/components/schemas/PaymentRequirement" }
        extensions: { type: object, additionalProperties: true }

    PaymentPayload:
      type: object
      description: x402 v2 PaymentPayload; sent base64-encoded in PAYMENT-SIGNATURE
      required: [x402Version, accepted, payload]
      properties:
        x402Version: { type: integer, enum: [2] }
        resource: { $ref: "#/components/schemas/ResourceInfo" }
        accepted: { $ref: "#/components/schemas/PaymentRequirement" }
        payload:
          type: object
          required: [receipt]
          properties:
            receipt: { type: string, description: Signed single-use JWT from POST /api/pay }
        extensions: { type: object, additionalProperties: true }

    Receipt:
      type: object
      required: [receipt, paymentSignature, amount, expiresAt]
      properties:
        receipt: { type: string, description: Signed single-use JWT }
        paymentSignature: { type: string, description: Base64 PaymentPayload wrapping the receipt; send as the PAYMENT-SIGNATURE header }
        amount: { $ref: "#/components/schemas/MicroUsd" }
        expiresAt: { type: string, format: date-time }

    Approval:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, approved, denied] }
        amount: { $ref: "#/components/schemas/MicroUsd" }
        receipt: { type: string, description: Present once approved }

    Listing:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [http, mcp] }
        rating: { type: number }
        seller: { type: string }
        endpoints:
          type: array
          items:
            type: object
            properties:
              method: { type: string }
              path: { type: string }
              description: { type: string }
              price: { $ref: "#/components/schemas/MicroUsd" }
              freeQuota: { type: integer }

    Wallet:
      type: object
      properties:
        agentId: { type: string }
        orgId: { type: string }
        billing: { type: string, enum: [prepaid, invoiced] }
        balance: { $ref: "#/components/schemas/MicroUsd" }
        creditRemaining: { $ref: "#/components/schemas/MicroUsd" }
        frozen: { type: boolean }
        budgets:
          type: array
          items:
            type: object
            properties:
              scope: { type: string, enum: [org, team, agent, task] }
              period: { type: string }
              max: { $ref: "#/components/schemas/MicroUsd" }
              remaining: { $ref: "#/components/schemas/MicroUsd" }

    FacilitatorRequest:
      type: object
      description: x402 v2 facilitator /verify and /settle request
      required: [x402Version, paymentPayload, paymentRequirements]
      properties:
        x402Version: { type: integer, enum: [2] }
        paymentPayload: { $ref: "#/components/schemas/PaymentPayload" }
        paymentRequirements: { $ref: "#/components/schemas/PaymentRequirement" }

    Settlement:
      type: object
      description: x402 v2 SettlementResponse
      required: [success, transaction, network]
      properties:
        success: { type: boolean }
        errorReason: { type: string, description: "Present on failure, e.g. upstream_failed or challenge_expired" }
        errorMessage: { type: string }
        transaction: { type: string, description: Piko Call id; empty string when nothing was settled }
        network: { type: string, example: "paypal:sandbox" }
        payer: { type: string, description: Agent id }
        amount: { $ref: "#/components/schemas/MicroUsd" }
        extensions: { type: object, additionalProperties: true }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_key, agent_frozen, breaker_tripped, policy_denied, approval_pending, budget_exceeded, insufficient_funds, challenge_expired, challenge_buyer_mismatch, upstream_failed, not_found, invalid_request, invalid_amount]
            message: { type: string }
          additionalProperties: true
